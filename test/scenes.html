<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>facad3 Test Suite</title>

    <link rel="stylesheet" href="../src/index.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        h2 {
            color: #888;
            font-weight: normal;
            margin-top: 50px;
            border-bottom: 1px solid #333;
            width: 600px;
            padding-bottom: 10px;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .fcd3-viewport {
            width: 600px;
            height: 400px;
            background: #0d0d0d;
            border: 2px solid #333;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .controls {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            width: 600px;
            box-sizing: border-box;
            border: 1px solid #333;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 120px;
        }

        label {
            font-size: 11px;
            margin-bottom: 5px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #007bff;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        button.active {
            background: #dc3545;
        }

        /* Scene Specific Elements */
        .ground {
            --w: 800px;
            --h: 800px;
            --color: #2c3e50;
            --rx: 90deg;
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .pillar {
            --w: 40px;
            --h: 150px;
            --color: #e67e22;
            border: 1px solid #d35400;
        }

        .sign {
            --w: 140px;
            --h: 60px;
            --color-front: #f1c40f;
            --color-back: #f39c12;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #333;
            border: 2px solid #333;
            box-sizing: border-box;
        }

        .popup {
            --w: 80px;
            --h: 80px;
            --color: #e74c3c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
            border: 2px solid #c0392b;
            box-sizing: border-box;
        }

        .die-face {
            --w: 100px;
            --h: 100px;
            font-size: 40px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #333;
            box-sizing: border-box;
            background: #fff;
        }
    </style>
</head>

<body>

    <h1>facad3 Test Suite</h1>

    <!-- =========================================
     SCENE 1: THE TILTED FOREST
     ========================================= -->
    <h2>Scene 1: Basic Planes & Camera Tilt</h2>
    <div class="scene-container">
        <div id="scene1" class="fcd3-viewport">
            <div class="fcd3-camera">
                <div class="fcd3-scene">
                    <!-- Ground -->
                    <div class="fcd3-plane ground"></div>
                    <!-- Forest Pillars -->
                    <div class="fcd3-plane pillar" style="--x: -150px; --z: 100px; --y: -75px;"></div>
                    <div class="fcd3-plane pillar" style="--x: 100px; --z: -50px; --y: -75px; --ry: 45deg;"></div>
                    <div class="fcd3-plane pillar" style="--x: -50px; --z: -150px; --y: -75px; --ry: -30deg;"></div>
                    <div class="fcd3-plane pillar" style="--x: 200px; --z: 150px; --y: -75px; --ry: 15deg;"></div>
                </div>
            </div>
        </div>
        <div class="controls">
            <div class="control-group">
                <label>Pitch (X)</label>
                <input type="range" id="s1-rx" min="-90" max="90" value="0">
            </div>
            <div class="control-group">
                <label>Yaw (Y)</label>
                <input type="range" id="s1-ry" min="-180" max="180" value="0">
            </div>
            <div class="control-group">
                <label>Roll (Z)</label>
                <input type="range" id="s1-rz" min="-45" max="45" value="0">
            </div>
        </div>
    </div>

    <!-- =========================================
     SCENE 2: BILLBOARD ORBIT
     ========================================= -->
    <h2>Scene 2: Billboards & Orbit Controls</h2>
    <div class="scene-container">
        <!-- Note the --cam-pivot-y and --cam-z to create the orbit effect -->
        <div id="scene2" class="fcd3-viewport" style="--cam-pivot-z: -600px; --cam-z: -600px; --cam-y: 200px">
            <div class="fcd3-camera">
                <div class="fcd3-scene">
                    <div class="fcd3-plane ground"></div>
                    <div class="fcd3-plane pillar" style="--x: -150px; --z: 100px; --y: -75px;"></div>
                    <div class="fcd3-plane pillar" style="--x: 100px; --z: -50px; --y: -75px;"></div>

                    <!-- Base Billboard (Stays upright) -->
                    <div class="fcd3-plane fcd3-billboard fcd3-double-sided sign"
                        style="--x: 0px; --y: -90px; --z: 50px;">
                        BASE (Y-AXIS)
                    </div>

                    <!-- Free Billboard (Faces camera directly) -->
                    <div class="fcd3-plane fcd3-billboard-free fcd3-double-sided popup"
                        style="--x: -200px; --y: -100px; --z: -100px;">
                        FREE
                    </div>
                </div>
            </div>
        </div>
        <div class="controls">
            <div class="control-group">
                <label>Orbit (Yaw)</label>
                <input type="range" id="s2-ry" min="-180" max="180" value="0">
            </div>
            <div class="control-group">
                <label>Elevation (Pitch)</label>
                <input type="range" id="s2-rx" min="-80" max="80" value="0">
            </div>
            <div class="control-group">
                <label>Zoom (Z)</label>
                <input type="range" id="s2-z" min="-1200" max="-200" value="-600">
            </div>
        </div>
    </div>

    <!-- =========================================
     SCENE 3: THE EXPLODING DIE
     ========================================= -->
    <h2>Scene 3: Complex Transforms & CSS Animations</h2>
    <div class="scene-container">
        <div id="scene3" class="fcd3-viewport" style="--explode: 0px; --cam-rx: -20deg; --cam-ry: 30deg;">
            <div class="fcd3-camera">
                <div class="fcd3-scene">
                    <!-- The 6 faces of the die. Notice how --explode is added to their base positions -->
                    <div class="fcd3-plane die-face" style="--z: calc(50px + var(--explode)); color: #e74c3c;">1</div>
                    <div class="fcd3-plane die-face"
                        style="--z: calc(-50px - var(--explode)); --ry: 180deg; color: #2ecc71;">2</div>
                    <div class="fcd3-plane die-face"
                        style="--x: calc(50px + var(--explode)); --ry: 90deg; color: #3498db;">3</div>
                    <div class="fcd3-plane die-face"
                        style="--x: calc(-50px - var(--explode)); --ry: -90deg; color: #f1c40f;">4</div>
                    <div class="fcd3-plane die-face"
                        style="--y: calc(-50px - var(--explode)); --rx: 90deg; color: #9b59b6;">5</div>
                    <div class="fcd3-plane die-face"
                        style="--y: calc(50px + var(--explode)); --rx: -90deg; color: #34495e;">6</div>
                </div>
            </div>
        </div>
        <div class="controls">
            <div class="control-group">
                <label>Pitch (Drag Mouse)</label>
                <input type="range" id="s3-rx" min="-90" max="90" value="-20">
            </div>
            <div class="control-group">
                <label>Yaw (Drag Mouse)</label>
                <input type="range" id="s3-ry" min="-180" max="180" value="30">
            </div>
            <div class="control-group" style="justify-content: flex-end;">
                <button id="s3-explode">Explode</button>
            </div>
        </div>
    </div>

    <script>
        // Helper to bind sliders to CSS variables
        function bindSlider(sliderId, viewportId, cssVar, suffix = '') {
            const slider = document.getElementById(sliderId);
            const viewport = document.getElementById(viewportId);
            slider.addEventListener('input', () => {
                viewport.style.setProperty(cssVar, slider.value + suffix);
            });
        }

        // Scene 1 Bindings
        bindSlider('s1-rx', 'scene1', '--cam-rx', 'deg');
        bindSlider('s1-ry', 'scene1', '--cam-ry', 'deg');
        bindSlider('s1-rz', 'scene1', '--cam-rz', 'deg');

        // Scene 2 Bindings
        bindSlider('s2-ry', 'scene2', '--cam-ry', 'deg');
        bindSlider('s2-rx', 'scene2', '--cam-rx', 'deg');
        bindSlider('s2-z', 'scene2', '--cam-z', 'px');

        // Scene 3 Bindings & Logic
        const scene3 = document.getElementById('scene3');
        let s3_rx = -20;
        let s3_ry = 30;

        // Sync sliders with initial state
        document.getElementById('s3-rx').value = s3_rx;
        document.getElementById('s3-ry').value = s3_ry;

        // Slider inputs update the JS variables
        document.getElementById('s3-rx').addEventListener('input', (e) => {
            s3_rx = parseFloat(e.target.value);
            scene3.style.setProperty('--cam-rx', s3_rx + 'deg');
        });
        document.getElementById('s3-ry').addEventListener('input', (e) => {
            s3_ry = parseFloat(e.target.value);
            scene3.style.setProperty('--cam-ry', s3_ry + 'deg');
        });

        // Mouse drag to rotate the die
        let isDragging = false;
        let lastX, lastY;

        scene3.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
            scene3.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            lastX = e.clientX;
            lastY = e.clientY;

            s3_ry += dx * 0.5;
            s3_rx -= dy * 0.5;

            // Clamp pitch to avoid gimbal lock weirdness
            s3_rx = Math.max(-90, Math.min(90, s3_rx));

            scene3.style.setProperty('--cam-ry', s3_ry + 'deg');
            scene3.style.setProperty('--cam-rx', s3_rx + 'deg');

            // Update sliders to reflect mouse movement
            document.getElementById('s3-rx').value = s3_rx;
            document.getElementById('s3-ry').value = s3_ry;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            scene3.style.cursor = 'grab';
        });

        scene3.style.cursor = 'grab';

        // Explode Button
        const explodeBtn = document.getElementById('s3-explode');
        let isExploded = false;

        explodeBtn.addEventListener('click', () => {
            isExploded = !isExploded;
            // We animate the --explode variable. The calc() in the inline styles handles the rest!
            scene3.style.setProperty('--explode', isExploded ? '150px' : '0px');
            scene3.style.transition = 'all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

            explodeBtn.textContent = isExploded ? 'Assemble' : 'Explode';
            explodeBtn.classList.toggle('active', isExploded);
        });
    </script>

</body>

</html>
